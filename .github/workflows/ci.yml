
name: Carbon Measurement POC - Baseline

on:
  push:
    branches:
      - main

jobs:
  baseline:
    name: Baseline Docker Build and Test

    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test application
        shell: pwsh
        run: |
          $start = [DateTimeOffset]::UtcNow
          Write-Host "WORKLOAD_START_UTC=$($start.ToString('o'))"

          docker build -t carbon-measurement-poc:${{ github.run_id }} .

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          docker run --rm carbon-measurement-poc:${{ github.run_id }}

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          $end = [DateTimeOffset]::UtcNow
          Write-Host "WORKLOAD_END_UTC=$($end.ToString('o'))"
